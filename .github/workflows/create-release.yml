name: "Create Release"

on:
  push:
    branches:
      - 2.x
      - 3.x
      - master
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - '.github/**'

permissions:
  contents: write
  pull-requests: read

jobs:
  check-for-release:
    runs-on: ubuntu-latest
    outputs:
      should-release: ${{ steps.check.outputs.should-release }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if release is needed
        id: check
        run: |
          # Get the current version from composer.json
          CURRENT_VERSION=$(jq -r '.version // "0.0.0"' composer.json)
          
          # Get the latest tag
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          LATEST_VERSION=${LATEST_TAG#v}
          
          # Check if we should create a release based on commit messages
          COMMITS_SINCE_TAG=$(git rev-list ${LATEST_TAG}..HEAD --count 2>/dev/null || git rev-list HEAD --count)
          
          if [ "$COMMITS_SINCE_TAG" -gt 0 ]; then
            # Determine version bump based on commit messages
            MAJOR_CHANGES=$(git log ${LATEST_TAG}..HEAD --grep="BREAKING CHANGE" --grep="!:" --count 2>/dev/null || echo "0")
            MINOR_CHANGES=$(git log ${LATEST_TAG}..HEAD --grep="feat" --count 2>/dev/null || echo "0")
            PATCH_CHANGES=$(git log ${LATEST_TAG}..HEAD --grep="fix" --count 2>/dev/null || echo "0")
            
            # Auto-increment version
            IFS='.' read -ra VERSION_PARTS <<< "$LATEST_VERSION"
            MAJOR=${VERSION_PARTS[0]:-0}
            MINOR=${VERSION_PARTS[1]:-0}
            PATCH=${VERSION_PARTS[2]:-0}
            
            if [ "$MAJOR_CHANGES" -gt 0 ]; then
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
            elif [ "$MINOR_CHANGES" -gt 0 ]; then
              MINOR=$((MINOR + 1))
              PATCH=0
            else
              PATCH=$((PATCH + 1))
            fi
            
            NEW_VERSION="$MAJOR.$MINOR.$PATCH"
            NEW_TAG="v$NEW_VERSION"
            
            echo "should-release=true" >> $GITHUB_OUTPUT
            echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
            echo "tag=$NEW_TAG" >> $GITHUB_OUTPUT
          else
            echo "should-release=false" >> $GITHUB_OUTPUT
          fi

  create-release:
    needs: check-for-release
    if: needs.check-for-release.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Release Notes
        id: generate_notes
        run: |
          # Get the latest tag
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          
          if [ -z "$LATEST_TAG" ]; then
            # If no previous tag, get all commits
            COMMITS=$(git log --pretty=format:"- %s (%h)" --reverse)
          else
            # Get commits since last tag
            COMMITS=$(git log ${LATEST_TAG}..HEAD --pretty=format:"- %s (%h)" --reverse)
          fi
          
          # Categorize commits
          BREAKING_CHANGES=""
          FEATURES=""
          FIXES=""
          OTHER=""
          
          while IFS= read -r commit; do
            if echo "$commit" | grep -qE "(BREAKING CHANGE|!:)"; then
              BREAKING_CHANGES="$BREAKING_CHANGES$commit"$'\n'
            elif echo "$commit" | grep -qE "^- feat"; then
              FEATURES="$FEATURES$commit"$'\n'
            elif echo "$commit" | grep -qE "^- fix"; then
              FIXES="$FIXES$commit"$'\n'
            else
              OTHER="$OTHER$commit"$'\n'
            fi
          done <<< "$COMMITS"
          
          # Build release notes
          RELEASE_NOTES="## What's Changed in ${{ needs.check-for-release.outputs.version }}"$'\n\n'
          
          if [ -n "$BREAKING_CHANGES" ]; then
            RELEASE_NOTES="$RELEASE_NOTES### 💥 Breaking Changes"$'\n'"$BREAKING_CHANGES"$'\n'
          fi
          
          if [ -n "$FEATURES" ]; then
            RELEASE_NOTES="$RELEASE_NOTES### ✨ New Features"$'\n'"$FEATURES"$'\n'
          fi
          
          if [ -n "$FIXES" ]; then
            RELEASE_NOTES="$RELEASE_NOTES### 🐛 Bug Fixes"$'\n'"$FIXES"$'\n'
          fi
          
          if [ -n "$OTHER" ]; then
            RELEASE_NOTES="$RELEASE_NOTES### 🔧 Other Changes"$'\n'"$OTHER"$'\n'
          fi
          
          # Add installation instructions
          RELEASE_NOTES="$RELEASE_NOTES"$'\n'"## Installation"$'\n\n'
          RELEASE_NOTES="$RELEASE_NOTES\`\`\`bash"$'\n'
          RELEASE_NOTES="$RELEASE_NOTES""composer require solution-forest/tab-layout-plugin:^${{ needs.check-for-release.outputs.version }}"$'\n'
          RELEASE_NOTES="$RELEASE_NOTES\`\`\`"$'\n\n'
          
          # Save to file for GitHub release
          echo "$RELEASE_NOTES" > release_notes.md
          
          # Output for GitHub (escape newlines)
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$RELEASE_NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.check-for-release.outputs.tag }}
          release_name: "Release ${{ needs.check-for-release.outputs.version }}"
          body: ${{ steps.generate_notes.outputs.notes }}
          draft: false
          prerelease: false

  update-changelog:
    needs: [check-for-release, create-release]
    if: needs.check-for-release.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create or Update CHANGELOG.md
        run: |
          # Create CHANGELOG.md if it doesn't exist
          if [ ! -f CHANGELOG.md ]; then
            echo "# Changelog" > CHANGELOG.md
            echo "" >> CHANGELOG.md
            echo "All notable changes to this project will be documented in this file." >> CHANGELOG.md
            echo "" >> CHANGELOG.md
          fi
          
          # Get release notes from the previous job
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          
          if [ -z "$LATEST_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)" --reverse)
          else
            COMMITS=$(git log ${LATEST_TAG}..HEAD --pretty=format:"- %s (%h)" --reverse)
          fi
          
          # Prepare the new entry
          NEW_ENTRY="## [${{ needs.check-for-release.outputs.version }}] - $(date +%Y-%m-%d)"$'\n\n'
          
          # Categorize commits for CHANGELOG
          while IFS= read -r commit; do
            if echo "$commit" | grep -qE "(BREAKING CHANGE|!:)"; then
              NEW_ENTRY="$NEW_ENTRY### Changed"$'\n'"$commit"$'\n\n'
            elif echo "$commit" | grep -qE "^- feat"; then
              NEW_ENTRY="$NEW_ENTRY### Added"$'\n'"$commit"$'\n\n'
            elif echo "$commit" | grep -qE "^- fix"; then
              NEW_ENTRY="$NEW_ENTRY### Fixed"$'\n'"$commit"$'\n\n'
            fi
          done <<< "$COMMITS"
          
          # Insert the new entry after the header
          awk -v new_entry="$NEW_ENTRY" '
            NR==1 { print; next }
            NR==2 && /^$/ { print; print new_entry; next }
            NR==3 && !/^$/ { print new_entry; print; next }
            { print }
          ' CHANGELOG.md > CHANGELOG.tmp && mv CHANGELOG.tmp CHANGELOG.md

      - name: Commit CHANGELOG
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "Update CHANGELOG for v${{ needs.check-for-release.outputs.version }}"
          file_pattern: CHANGELOG.md
